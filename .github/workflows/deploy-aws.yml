name: Deploy AWS

"on":
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
    env:
      TF_ENV: prod
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      - name: Validate required environment secrets
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_LOCK_TABLE: ${{ secrets.TF_LOCK_TABLE }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VPC_ID: ${{ secrets.VPC_ID }}
          PUBLIC_SUBNET_IDS_JSON: ${{ secrets.PUBLIC_SUBNET_IDS_JSON }}
        run: |
          set -euo pipefail
          for name in AWS_ROLE_ARN TF_STATE_BUCKET TF_LOCK_TABLE NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY CLERK_SECRET_KEY OPENAI_API_KEY VPC_ID PUBLIC_SUBNET_IDS_JSON; do
            eval "val=\${$name:-}"
            if [ -z "${val}" ]; then
              echo "Missing required environment secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0
          terraform_wrapper: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Create temporary backend block for CI
        run: |
          cat > infra/terraform/backend.ci.tf <<'EOF'
          terraform {
            backend "s3" {}
          }
          EOF

      - name: Terraform init
        run: |
          set -euo pipefail
          terraform -chdir=infra/terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=fleet-health-copilot/${TF_ENV}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Terraform validate
        run: terraform -chdir=infra/terraform validate -no-color

      - name: Resolve desired runtime mode
        id: desired-runtime
        run: |
          set -euo pipefail
          if grep -Eq '^[[:space:]]*enable_single_instance[[:space:]]*=[[:space:]]*true' "infra/terraform/env/${TF_ENV}.tfvars"; then
            echo "mode=single-instance" >> "$GITHUB_OUTPUT"
          else
            echo "mode=ecs" >> "$GITHUB_OUTPUT"
          fi

      - name: Terraform apply (bootstrap latest tags)
        if: steps.desired-runtime.outputs.mode == 'ecs'
        env:
          TF_VAR_vpc_id: ${{ secrets.VPC_ID }}
          TF_VAR_public_subnet_ids: ${{ secrets.PUBLIC_SUBNET_IDS_JSON }}
        run: |
          set -euo pipefail
          terraform -chdir=infra/terraform apply -auto-approve -input=false \
            -var-file="env/${TF_ENV}.tfvars" \
            -var="github_repository=${{ github.repository }}" \
            -var="web_next_public_clerk_publishable_key=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}" \
            -var='container_image_tags={web="latest",orchestrator="latest"}'

      - name: Terraform apply (bootstrap single instance)
        if: steps.desired-runtime.outputs.mode == 'single-instance'
        env:
          TF_VAR_vpc_id: ${{ secrets.VPC_ID }}
          TF_VAR_public_subnet_ids: ${{ secrets.PUBLIC_SUBNET_IDS_JSON }}
        run: |
          set -euo pipefail
          terraform -chdir=infra/terraform apply -auto-approve -input=false \
            -var-file="env/${TF_ENV}.tfvars" \
            -var="github_repository=${{ github.repository }}" \
            -var="web_next_public_clerk_publishable_key=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}" \
            -var='container_image_tags={web="latest",orchestrator="latest"}' \
            -var="enable_ecs=true" \
            -var="enable_postgres=true" \
            -var="enable_api_gateway=true" \
            -var="enable_waf=true" \
            -var="enable_single_instance=true" \
            -var="cloudfront_origin_mode=ecs"

      - name: Ensure Clerk runtime secret value is set
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: |
          set -euo pipefail
          secret_arn=$(terraform -chdir=infra/terraform output -json managed_secret_arns | jq -r '."CLERK_SECRET_KEY" // empty')
          if [ -z "${secret_arn}" ]; then
            echo "Unable to resolve managed secret ARN for CLERK_SECRET_KEY" >&2
            exit 1
          fi

          aws secretsmanager put-secret-value \
            --secret-id "${secret_arn}" \
            --secret-string "${CLERK_SECRET_KEY}" >/dev/null

      - name: Ensure OpenAI runtime secret value is set
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          secret_arn=$(terraform -chdir=infra/terraform output -json managed_secret_arns | jq -r '."OPENAI_API_KEY" // empty')
          if [ -z "${secret_arn}" ]; then
            echo "Unable to resolve managed secret ARN for OPENAI_API_KEY" >&2
            exit 1
          fi

          aws secretsmanager put-secret-value \
            --secret-id "${secret_arn}" \
            --secret-string "${OPENAI_API_KEY}" >/dev/null

      - name: Resolve ECR repository URLs
        id: ecr
        run: |
          set -euo pipefail
          json=$(terraform -chdir=infra/terraform output -json ecr_repository_urls)
          web=$(echo "${json}" | jq -r '."web" // empty')
          orchestrator=$(echo "${json}" | jq -r '."orchestrator" // empty')
          if [ -z "${web}" ] || [ -z "${orchestrator}" ]; then
            echo "Missing ECR repository outputs." >&2
            exit 1
          fi
          echo "web=${web}" >> "$GITHUB_OUTPUT"
          echo "orchestrator=${orchestrator}" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.web }}:${{ github.sha }}
            ${{ steps.ecr.outputs.web }}:latest
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}

      - name: Build and push orchestrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/orchestrator/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.orchestrator }}:${{ github.sha }}
            ${{ steps.ecr.outputs.orchestrator }}:latest

      - name: Resolve runtime mode
        id: runtime
        run: |
          set -euo pipefail
          single_instance_id=$(terraform -chdir=infra/terraform output -raw single_instance_id 2>/dev/null || true)
          if [ -n "${single_instance_id}" ] && [ "${single_instance_id}" != "null" ]; then
            echo "mode=single-instance" >> "$GITHUB_OUTPUT"
            echo "single_instance_id=${single_instance_id}" >> "$GITHUB_OUTPUT"
          else
            echo "mode=ecs" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy single-instance runtime with SSM
        if: steps.runtime.outputs.mode == 'single-instance'
        env:
          INSTANCE_ID: ${{ steps.runtime.outputs.single_instance_id }}
          WEB_IMAGE: ${{ steps.ecr.outputs.web }}:${{ github.sha }}
          ORCHESTRATOR_IMAGE: ${{ steps.ecr.outputs.orchestrator }}:${{ github.sha }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            ping_status=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${INSTANCE_ID}" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text 2>/dev/null || true)
            if [ "${ping_status}" = "Online" ]; then
              echo "SSM instance is online: ${INSTANCE_ID}"
              break
            fi
            if [ "${i}" = "30" ]; then
              echo "SSM instance did not come online: ${INSTANCE_ID}" >&2
              exit 1
            fi
            echo "Waiting for SSM instance (${i}/30), status=${ping_status}"
            sleep 10
          done

          secrets_json=$(terraform -chdir=infra/terraform output -json managed_secret_arns)
          clerk_secret_arn=$(echo "${secrets_json}" | jq -r '."CLERK_SECRET_KEY" // empty')
          openai_secret_arn=$(echo "${secrets_json}" | jq -r '."OPENAI_API_KEY" // empty')
          if [ -z "${clerk_secret_arn}" ] || [ -z "${openai_secret_arn}" ]; then
            echo "Missing managed secret ARNs for single-instance deployment." >&2
            exit 1
          fi

          cat > deploy-single-instance.sh <<'SCRIPT'
          set -euo pipefail
          install_pkg() {
            if ! command -v "$1" >/dev/null 2>&1; then
              dnf install -y "$2"
            fi
          }

          install_pkg docker docker
          install_pkg aws awscli
          install_pkg curl curl
          if ! docker compose version >/dev/null 2>&1; then
            arch="$(uname -m)"
            case "$arch" in
              x86_64) compose_arch="x86_64" ;;
              aarch64|arm64) compose_arch="aarch64" ;;
              *) echo "Unsupported architecture for Docker Compose: $arch" >&2; exit 1 ;;
            esac
            mkdir -p /usr/local/lib/docker/cli-plugins
            curl -fsSL \
              "https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-${compose_arch}" \
              -o /usr/local/lib/docker/cli-plugins/docker-compose
            chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
            docker compose version
          fi

          systemctl enable --now docker
          mkdir -p /opt/fleet-health/data
          if ! mountpoint -q /opt/fleet-health/data; then
            DATA_DEVICE=""
            for candidate in \
              "/dev/xvdf" \
              "/dev/sdf" \
              "/dev/nvme1n1"; do
              if [ -e "$candidate" ]; then
                DATA_DEVICE="$candidate"
                break
              fi
            done

            if [ -n "$DATA_DEVICE" ]; then
              if ! blkid "$DATA_DEVICE"; then
                mkfs.ext4 -F "$DATA_DEVICE"
              fi

              DATA_UUID="$(blkid -s UUID -o value "$DATA_DEVICE")"
              if ! grep -q "$DATA_UUID" /etc/fstab; then
                echo "UUID=$DATA_UUID /opt/fleet-health/data ext4 defaults,nofail 0 2" >> /etc/fstab
              fi
              mount /opt/fleet-health/data
            fi
          fi

          CLERK_SECRET_KEY="$(aws secretsmanager get-secret-value --secret-id "__CLERK_SECRET_ARN__" --query SecretString --output text)"
          OPENAI_API_KEY="$(aws secretsmanager get-secret-value --secret-id "__OPENAI_SECRET_ARN__" --query SecretString --output text)"

          aws ecr get-login-password --region "__AWS_REGION__" | docker login --username AWS --password-stdin "__ECR_REGISTRY__"

          cat > /opt/fleet-health/.env <<ENVFILE
          WEB_IMAGE=__WEB_IMAGE__
          ORCHESTRATOR_IMAGE=__ORCHESTRATOR_IMAGE__
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=__NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY__
          CLERK_SECRET_KEY=$CLERK_SECRET_KEY
          OPENAI_API_KEY=$OPENAI_API_KEY
          ENVFILE
          chmod 600 /opt/fleet-health/.env

          cat > /opt/fleet-health/docker-compose.yml <<'COMPOSE'
          services:
            web:
              image: ${WEB_IMAGE}
              restart: unless-stopped
              ports:
                - "80:3000"
              environment:
                NODE_ENV: production
                HOSTNAME: 0.0.0.0
                PORT: "3000"
                ORCHESTRATOR_API_BASE_URL: http://orchestrator:8000
                NEXT_PUBLIC_ORCHESTRATOR_API_BASE_URL: ""
                NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
                CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
              depends_on:
                - orchestrator

            orchestrator:
              image: ${ORCHESTRATOR_IMAGE}
              restart: unless-stopped
              ports:
                - "127.0.0.1:8000:8000"
              volumes:
                - /opt/fleet-health/data:/data
              environment:
                FLEET_DB_PATH: /data/fleet-health.db
                FLEET_RETRIEVAL_BACKEND: lexical
                OPENAI_API_KEY: ${OPENAI_API_KEY}
          COMPOSE

          docker compose --env-file /opt/fleet-health/.env -f /opt/fleet-health/docker-compose.yml pull
          docker compose --env-file /opt/fleet-health/.env -f /opt/fleet-health/docker-compose.yml up -d --remove-orphans

          for i in $(seq 1 24); do
            web_code=$(curl -o /dev/null -s -w "%{http_code}" http://localhost/health || true)
            orch_code=$(curl -o /dev/null -s -w "%{http_code}" http://localhost:8000/health || true)
            if [ "$web_code" = "200" ] && [ "$orch_code" = "200" ]; then
              docker compose --env-file /opt/fleet-health/.env -f /opt/fleet-health/docker-compose.yml ps
              exit 0
            fi
            echo "Waiting for services (${i}/24): web=${web_code}, orchestrator=${orch_code}"
            sleep 10
          done

          docker compose --env-file /opt/fleet-health/.env -f /opt/fleet-health/docker-compose.yml ps
          docker compose --env-file /opt/fleet-health/.env -f /opt/fleet-health/docker-compose.yml logs --tail=120
          exit 1
          SCRIPT

          ecr_registry="${{ steps.ecr.outputs.web }}"
          ecr_registry="${ecr_registry%%/*}"
          sed -i \
            -e "s#__CLERK_SECRET_ARN__#${clerk_secret_arn}#g" \
            -e "s#__OPENAI_SECRET_ARN__#${openai_secret_arn}#g" \
            -e "s#__AWS_REGION__#${AWS_REGION}#g" \
            -e "s#__ECR_REGISTRY__#${ecr_registry}#g" \
            -e "s#__WEB_IMAGE__#${WEB_IMAGE}#g" \
            -e "s#__ORCHESTRATOR_IMAGE__#${ORCHESTRATOR_IMAGE}#g" \
            -e "s#__NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY__#${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}#g" \
            deploy-single-instance.sh

          jq -n --rawfile command deploy-single-instance.sh \
            '{commands: [$command], executionTimeout: ["900"]}' > ssm-parameters.json

          command_id=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Fleet Health Copilot single-instance runtime" \
            --parameters file://ssm-parameters.json \
            --query "Command.CommandId" \
            --output text)

          set +e
          aws ssm wait command-executed --command-id "${command_id}" --instance-id "${INSTANCE_ID}"
          wait_status=$?
          set -e
          aws ssm get-command-invocation \
            --command-id "${command_id}" \
            --instance-id "${INSTANCE_ID}" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output text
          exit "${wait_status}"

      - name: Prepare removable PostgreSQL database
        if: steps.runtime.outputs.mode == 'single-instance'
        run: |
          set -euo pipefail
          db_identifier="fleet-health-copilot-${TF_ENV}-postgres"
          db_status=$(aws rds describe-db-instances \
            --db-instance-identifier "${db_identifier}" \
            --query 'DBInstances[0].DBInstanceStatus' \
            --output text 2>/dev/null || true)
          if [ -z "${db_status}" ] || [ "${db_status}" = "None" ]; then
            echo "No existing PostgreSQL DB found for ${db_identifier}; skipping deletion protection update."
            exit 0
          fi

          protection=$(aws rds describe-db-instances \
            --db-instance-identifier "${db_identifier}" \
            --query 'DBInstances[0].DeletionProtection' \
            --output text)
          if [ "${protection}" != "True" ]; then
            echo "Deletion protection already disabled for ${db_identifier}."
            exit 0
          fi

          aws rds modify-db-instance \
            --db-instance-identifier "${db_identifier}" \
            --no-deletion-protection \
            --apply-immediately >/dev/null
          aws rds wait db-instance-available --db-instance-identifier "${db_identifier}"

      - name: Terraform apply (pin image tags to commit SHA)
        env:
          TF_VAR_vpc_id: ${{ secrets.VPC_ID }}
          TF_VAR_public_subnet_ids: ${{ secrets.PUBLIC_SUBNET_IDS_JSON }}
        run: |
          set -euo pipefail
          terraform -chdir=infra/terraform apply -auto-approve -input=false \
            -var-file="env/${TF_ENV}.tfvars" \
            -var="github_repository=${{ github.repository }}" \
            -var="web_next_public_clerk_publishable_key=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}" \
            -var="container_image_tags={web=\"${{ github.sha }}\",orchestrator=\"${{ github.sha }}\"}"

      - name: Wait for ECS services to stabilize
        if: steps.runtime.outputs.mode == 'ecs'
        run: |
          set -euo pipefail
          cluster=$(terraform -chdir=infra/terraform output -raw ecs_cluster_name)
          echo "Waiting for ECS services to stabilize on cluster: ${cluster}"
          services=(web orchestrator)

          for i in $(seq 1 45); do
            stable_count=$(aws ecs describe-services \
              --cluster "${cluster}" \
              --services "${services[@]}" \
              --query 'length(services[?runningCount==desiredCount && length(deployments)==`1` && status==`ACTIVE`])' \
              --output text)

            echo "ECS stabilization check ${i}/45: ${stable_count}/${#services[@]} services stable"

            aws ecs describe-services \
              --cluster "${cluster}" \
              --services "${services[@]}" \
              --query 'services[].{service:serviceName,desired:desiredCount,running:runningCount,pending:pendingCount,rollout:deployments[?status==`PRIMARY`]|[0].rolloutState,reason:deployments[?status==`PRIMARY`]|[0].rolloutStateReason}' \
              --output table

            if [ "${stable_count}" = "${#services[@]}" ]; then
              echo "ECS services are stable."
              exit 0
            fi

            sleep 20
          done

          echo "ECS services failed to stabilize within the expected window." >&2
          aws ecs describe-services \
            --cluster "${cluster}" \
            --services "${services[@]}" \
            --query 'services[].events[:10].[createdAt,message]' \
            --output table || true
          exit 1

      - name: Post-deploy ALB health check
        if: steps.runtime.outputs.mode == 'ecs'
        run: |
          set -euo pipefail
          alb=$(terraform -chdir=infra/terraform output -raw web_load_balancer_dns_name)
          if [ -z "${alb}" ] || [ "${alb}" = "null" ]; then
            echo "Missing ALB DNS output." >&2
            exit 1
          fi

          for i in $(seq 1 10); do
            code=$(curl -k -o /dev/null -s -w "%{http_code}" "http://${alb}/health" || true)
            if [ "${code}" = "200" ]; then
              echo "ALB health check passed with HTTP ${code}"
              exit 0
            fi
            echo "Waiting for ALB (${i}/10), got HTTP ${code}"
            sleep 10
          done

          echo "ALB health check failed" >&2
          exit 1

      - name: Post-deploy API Gateway health check
        if: steps.runtime.outputs.mode == 'ecs'
        run: |
          set -euo pipefail
          apigw=$(terraform -chdir=infra/terraform output -raw orchestrator_api_gateway_url || true)
          if [ -z "${apigw}" ] || [ "${apigw}" = "null" ]; then
            echo "API Gateway not enabled; skipping orchestrator API health check."
            exit 0
          fi

          for i in $(seq 1 12); do
            code=$(curl -k -o /dev/null -s -w "%{http_code}" "${apigw%/}/health" || true)
            if [ "${code}" = "200" ]; then
              echo "API Gateway health check passed with HTTP ${code}"
              exit 0
            fi
            echo "Waiting for API Gateway (${i}/12), got HTTP ${code}"
            sleep 10
          done

          echo "API Gateway health check failed" >&2
          exit 1

      - name: Post-deploy CloudFront health check
        run: |
          set -euo pipefail
          entrypoint=$(terraform -chdir=infra/terraform output -raw web_public_entrypoint_url)
          if [ -z "${entrypoint}" ] || [ "${entrypoint}" = "null" ]; then
            echo "Missing public entrypoint output." >&2
            exit 1
          fi

          for i in $(seq 1 18); do
            code=$(curl -k -o /dev/null -s -w "%{http_code}" "${entrypoint%/}/health" || true)
            if [ "${code}" = "200" ]; then
              echo "CloudFront health check passed with HTTP ${code}: ${entrypoint}"
              exit 0
            fi
            echo "Waiting for CloudFront (${i}/18), got HTTP ${code}"
            sleep 10
          done

          echo "CloudFront health check failed for ${entrypoint}" >&2
          exit 1
